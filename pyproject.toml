[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "circuitpython-dap-prog"
version = "0.0.0+auto.0"
description = "PIO SWD programming, target power control, and USB identification for CircuitPython."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Seth Kerr"}]
keywords = ["circuitpython", "rp2040", "swd", "cmsis-dap", "programmer"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Embedded Systems",
  "Topic :: System :: Hardware",
]
dynamic = ["dependencies", "optional-dependencies"]

[project.urls]
Homepage = "https://github.com/skerr92/circuitpython_dap_prog"
Issues = "https://github.com/skerr92/circuitpython_dap_prog/issues"

[tool.setuptools]
py-modules = [
  "Kavrous_cmsis_dap",
  "Kavrous_power",
  "Kavrous_usb",
  "Kavrous_board",
  "Kavrous_status",
]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}
optional-dependencies = {display = {file = ["optional_requirements.txt"]}}
