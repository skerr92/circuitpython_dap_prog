name: Build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''
      version:
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      targets: ${{ steps.metadata.outputs.targets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install build dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run host tests
        run: |
          python -m unittest discover -s tests -v
          node --test tests/test_release_plan.cjs
      - name: Check Python package metadata
        run: |
          python -m build
          python -m twine check dist/*
      - name: Read compiler targets
        id: metadata
        run: echo "targets=$(python tools/build_release.py matrix)" >> "$GITHUB_OUTPUT"
      - name: Build source bundle
        env:
          BUNDLE_VERSION: ${{ inputs.version }}
        run: python tools/build_release.py build --target source --version "$BUNDLE_VERSION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundle-source
          path: bundles/*.zip
          if-no-files-found: error

  mpy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.test.outputs.targets) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Compile MPY bundle
        env:
          BUNDLE_VERSION: ${{ inputs.version }}
          CIRCUITPYTHON_TARGET: ${{ matrix.target }}
        run: python tools/build_release.py build --target "$CIRCUITPYTHON_TARGET" --version "$BUNDLE_VERSION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundle-${{ matrix.target }}
          path: bundles/*.zip
          if-no-files-found: error
